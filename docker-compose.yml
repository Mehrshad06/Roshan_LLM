services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - roshan_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5).close()"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

volumes:
  roshan_data:

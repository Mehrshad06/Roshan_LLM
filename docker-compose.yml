services:
  web:
    build: .
    env_file: .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - roshan_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5).close()"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    image: ollama/ollama:0.13.5
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-init:
    image: ollama/ollama:0.13.5
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL-deepseek-r1:7b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for model in "$$OLLAMA_MODEL" "$$OLLAMA_FALLBACK_MODEL"; do
          [ -z "$$model" ] || ollama show "$$model" >/dev/null 2>&1 || ollama pull "$$model"
        done
    restart: on-failure:3

volumes:
  ollama_models:
  roshan_data:
